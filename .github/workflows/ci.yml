name: CI

# The gates release.yml runs, on every pull request and every push to main, so a lint, test or
# packaging break fails here — before merge — instead of after a release is cut.
#
# Same sibling layout as release.yml: this repo at `ui/`, w6w-io/w6w-core at `core/`
# (pnpm-workspace.yaml links @w6w/expr to ../core/packages/expr).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
        with:
          path: ui
      - uses: actions/checkout@v6
        with:
          repository: w6w-io/w6w-core
          path: core
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # Every check lives in scripts/verify.sh, which the pre-push hook also runs.
      - run: bash scripts/verify.sh
